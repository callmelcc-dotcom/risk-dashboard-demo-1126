<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A集团风控指标看板</title>
<style>
/* VOICE: 务实的集团管控看板，像风控部门每季度报送给领导班子的监测报表
   IDEA: 一张可层层下钻的风险监测台账：集团 → 领域 → 公司 → 指标明细 → 处置闭环
   PICTURE: 一级是六个领域的状态面板与公司色块条；二级是公司×指标的着色矩阵
   COLOUR and TYPE: 白色面板 + 浅灰底 + 深石墨字；红/黄/绿/灰仅用于风险状态，始终配文字；Noto Sans SC + Inter 数字
   LAYOUT: 顶部固定期间与路径；内容最宽1240px；表格可横向滚动；600px以下单列堆叠 */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f4,#14171a);--panel:light-dark(#ffffff,#1d2125);--ink:light-dark(#1b1f24,#e6e9ec);--mute:light-dark(#5d6873,#9aa4ae);
--line:light-dark(#dde2e7,#2e343a);--head:light-dark(#26313c,#0f1215);--acc:light-dark(#2f5d8a,#7fb0de);
--r:#d1393a;--y:#e3a21a;--g:#22985a;--na:light-dark(#c9ced4,#454c53);
--rbg:light-dark(#fbe7e7,#3a2224);--ybg:light-dark(#fdf3dc,#3a3120);--gbg:light-dark(#e3f4ea,#1f3328)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
.num{font-family:Inter,"Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
header{background:var(--head);color:#fff;padding:14px max(4vw,16px);position:sticky;top:0;z-index:5}
.hrow{max-width:1240px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700}header .sub{font-size:12.5px;opacity:.72}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:6px;border:1px solid #56626e;background:#33404c;color:#fff;min-height:40px}
.crumb{max-width:1240px;margin:8px auto 0;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px;opacity:.95}
.crumb a{color:#bcd6ee;text-decoration:none;cursor:pointer}.crumb a:hover{text-decoration:underline}.crumb span.sep{opacity:.5}
main{max-width:1240px;margin:auto;padding:22px max(4vw,16px) 48px}
h2{font-size:24px;line-height:1.25;margin:0 0 6px;text-wrap:balance}h3{font-size:16px;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 18px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi .v{font-size:28px;font-weight:700}.kpi .l{font-size:13px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.c-r{color:var(--r);background:var(--rbg)}.c-y{color:#a46f00;background:var(--ybg)}.c-g{color:var(--g);background:var(--gbg)}
.c-na{color:var(--mute);background:light-dark(#eceff2,#2a2f34)}.c-miss{color:var(--r);background:var(--panel);border:1px solid var(--r)}
:root[data-theme=dark] .c-y,.dark .c-y{color:var(--y)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .c-y{color:var(--y)}}
.dcard{cursor:pointer;transition:box-shadow .15s;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--st)}
.dcard:hover,.dcard:focus-visible{box-shadow:0 4px 16px rgba(0,0,0,.10);outline:none}
.dcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.dcard .name{font-size:17px;font-weight:700}
.big{font-size:30px;font-weight:700;line-height:1}.big small{font-size:14px;color:var(--mute);font-weight:400}
.bar{height:8px;background:light-dark(#e9edf1,#2a2f34);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}.bar .mk{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--ink);opacity:.5}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:26px;height:24px;border-radius:4px;font:600 12px/24px Inter,sans-serif;text-align:center;color:#fff}
.s-r{background:var(--r)}.s-y{background:var(--y);color:#1b1f24}.s-g{background:var(--g)}.s-na{background:var(--na);color:var(--ink)}.s-miss{background:var(--panel);color:var(--r);outline:1.5px solid var(--r);outline-offset:-1.5px}
.note{font-size:12.5px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th.ic,td.ic{width:132px;min-width:132px;max-width:132px}th.ic{white-space:normal;vertical-align:bottom}
th{font-size:12.5px;color:var(--mute);font-weight:600;background:light-dark(#f6f8fa,#22272b);position:sticky;top:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:light-dark(#f4f7fa,#23292e)}
.cell{display:block;text-align:right;padding:5px 8px;border-radius:5px;font-size:13px;cursor:pointer}
.cell.s-r{color:#fff}.cell.s-g{background:var(--gbg);color:var(--ink)}.cell.s-y{background:var(--ybg)}.cell.s-na{background:transparent;color:var(--mute)}
.scroll{overflow-x:auto}
.key{color:var(--r);font-weight:700;margin-left:2px}
.btn{font:inherit;font-size:13.5px;min-height:36px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--acc);cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
dl.kv{display:grid;grid-template-columns:6.5em 1fr;gap:6px 12px;margin:0;font-size:13.5px}dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;white-space:pre-line}
.fig{position:relative;height:230px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--head);color:#fff;font-size:12.5px;padding:5px 8px;border-radius:5px;white-space:nowrap;display:none;z-index:3}
.loop{border-left:4px solid var(--r)}.loop .row{display:grid;grid-template-columns:7em 1fr;gap:4px 12px;margin:8px 0;font-size:13.5px}.loop .row b{color:var(--mute);font-weight:500}
.cons-一致{color:var(--g)}.cons-部分一致{color:#a46f00}.cons-不一致{color:var(--r)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--mute);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:14px;height:12px;border-radius:3px;display:inline-block}
details{margin-top:18px}summary{cursor:pointer;font-weight:600;padding:6px 0}
.rules li{margin:4px 0;font-size:13.5px}
.mock{font-size:12px;color:var(--mute);margin-top:14px}
.flag{font-size:12px;color:var(--r);white-space:nowrap}
@media(max-width:600px){header{position:static}.kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{padding:10px}.kpi .v{font-size:22px}h2{font-size:20px}.big{font-size:26px}table{font-size:12.5px}.loop .row{grid-template-columns:1fr}dl.kv{grid-template-columns:1fr}}
</style>
</head>

</header>

dir":"-","unit":"%","info":false},"aux":[{"label":"逾期金额","a":null,"b":null,"dir":null,"unit":"万元","info":true}]},{"id":"PUR-01","domain":"PUR","name":"供应商集中度\n（分品类）","dir":"负向","definition":"衡量各采购品类对少数供应商的依赖程度，识别因供应商过度集中产生的供应中断、议价能力弱化与串通投标隐患。","formula":"品类前五名供应商采购额占比＝该品类前五名供应商采购额÷该品类同期采购总额×100%；同时列示第一大供应商采购额占比。","freq":"季度","fk":"Q","dept":"采购中心\n各企业采购归口部门","tN":"前五名占比≤50%\n且第一大占比≤25%","tA":"前五名50%–70%\n或第一大25%–40%","tW":"前五名>70%\n或第一大>40%","resp":"关注档由采购归口部门会同需求部门出具品类供应结构分析并启动备选供应商寻源；预警档报分管领导，制定多元化供应方案，纳入下一年度采购策略与集中采购目录调整论证。","warnResp":"报分管领导，制定多元化供应方案，纳入下一年度采购策略与集中采购目录调整论证。","key":false,"main":{"label":"前五名供应商占比","a":50,"b":70,"dir":"-","unit":"%","info":false},"dim":"采购品类","mode":"worst","det":[{"label":"前五名占比","a":50,"b":70,"dir":"-","unit":"%","info":false},{"label":"第一大占比","a":25,"b":40,"dir":"-","unit":"%","info":false}]},{"id":"PUR-02","domain":"PUR","name":"单一供应商连续中标次数","dir":"负向","definition":"识别同一供应商在同品类中连续中标、高频中标及中标金额占比异常，监测是否存在评分规则被操纵、围标串标或长期固定单一供应商的情形。","formula":"①同品类单一供应商连续中标次数；②该供应商中标金额占该品类同期采购总额比例；③同一项目中疑似受同一实际控制人控制的投标人组数（辅助观察值）。","freq":"季度","fk":"Q","dept":"采购中心\n各企业采购归口部门","tN":"连续中标≤2次\n且金额占比≤30%","tA":"连续中标3次\n或占比30%–50%","tW":"连续中标≥4次\n或占比>50%","resp":"关注档由采购归口部门调阅该品类近12个月评审记录，核查评分规则一致性与评审专家抽取情况；预警档移送审计部开展采购专项检查，涉及串通投标线索的按采购违规行为处理与责任追究程序办理。","warnResp":"移送审计部开展采购专项检查，涉及串通投标线索的按采购违规行为处理与责任追究程序办理。","key":true,"main":{"label":"连续中标次数","a":2,"b":3,"dir":"-","unit":"次","info":false},"dim":"采购品类","mode":"worst","det":[{"label":"连续中标次数","a":2,"b":3,"dir":"-","unit":"次","info":false},{"label":"中标金额占比","a":30,"b":50,"dir":"-","unit":"%","info":false}]},{"id":"PUR-03","domain":"PUR","name":"采购价格偏离度","dir":"负向","definition":"衡量同品类、同规格采购成交价格相对市场参考价的偏离程度，识别“价格长期畸高”“寻源比价不充分”及预算编制不实等问题。","formula":"价格偏离度＝Σ（成交单价－参考价）×成交数量÷Σ参考价×成交数量×100%；同时列示高于参考价10%以上的采购笔数占比。","freq":"季度","fk":"Q","dept":"采购中心\n各企业采购归口部门","tN":"偏离度≤5%","tA":"偏离度5%–10%","tW":"偏离度>10%\n或高于参考价10%以上笔数占比>20%","resp":"关注档由采购归口部门会同需求部门分析价格构成与采购批量；预警档逐项复核预算（控制价）编制依据与寻源过程，结论用于下一年度预算编制与采购策略调整；涉及串通投标 末在库超期堆存占比≤10%","tA":"平均堆场货物周转天数30–60天，或期末在库超期堆存占比 10%–20%，或单个批次堆存>90天","tW":"平均堆场货物周转天数>60天，或期末在库超期堆存占比>20%，或单个批次堆存>180天（视同滞销/弃货风险）","resp":"达到免费堆存期/合同提货期（如超期3天）：系统自动生成《超期堆存提醒单》，向客户发送催提函及超期仓储费计费通知；业务人员必须在系统内填报客户真实提货意愿。\n\n超期严重（如超期15天）或客户拒付仓储费：系统直接冻结该客户所有新业务。\n\n触发弃货处置（超期30天且沟通无效）：必须与“存货浮亏”指标联动。由风控/法务部门介入，评估弃货风险；财务部门按规定扣划保证金，业务部门启动货物变卖、转售或移库程序，及时释放堆场空间，最大限度止损","warnResp":"达到免费堆存期/合同提货期（如超期3天）：系统自动生成《超期堆存提醒单》，向客户发送催提函及超期仓储费计费通知；业务人员必须在系统内填报客户真实提货意愿。\n\n超期严重（如超期15天）或客户拒付仓储费：系统直接冻结该客户所有新业务。\n\n触发弃货处置（超期30天且沟通无效）：必须与“存货浮亏”指标联动。由风控/法务部门介入，评估弃货风险；财务部门按规定扣划保证金，业务部门启动货物变卖、转售或移库程序，及时释放堆场空间，最大限度止损","key":false,"main":{"label":"平均堆场周转天数","a":30,"b":60,"dir":"-","unit":"天","info":false},"dim":"客户","mode":"agg","det":[{"label":"最长单批次堆存天数","a":90,"b":180,"dir":"-","unit":"天","info":false},{"label":"超期堆存占比","a":10,"b":20,"dir":"-","unit":"%","info":false}]},{"id":"TRD-03","domain":"TRD","name":"赊销额度剩余比例","dir":"正向","definition":"衡量客户赊销额度的剩余空间，识别额度被应收、已发货未结算及在手订单过度占用导致的信用敞口失控风险；逾期款项不释放额度。","formula":"赊销额度剩余比例 =（Σ客户赊销额度 − Σ已占用额度）÷ Σ客户赊销额度 × 100%\n已占用额度 = 应收账款余额（含逾期）+ 已发货未结算金额 + 在手订单已排产未交付金额\n单户剩余比例 =（该客户赊销额度 − 该客户已占用额度）÷ 该客户赊销额度 × 100%","freq":"月度（季度末与赊销年度复核同步）","fk":"M","dept":"贸易公司市场部/市场经营部\n贸易公司财务部门","tN":"剩余比例≥30%，且单户剩余比例≥10%","tA":"剩余比例15%–30%；或单户剩余比例5%–10%","tW":"剩余比例<15%；或单户剩余比例<5%","resp":"关注档：财务部 5 个工作日内出具《赊销额度占用分析表》，逐户列明剩余额度、可释放额度（已收款待核销、在途结算）与到期日；业务部门暂停该客户新增赊销与账期延长，新增业务改为先款后货、预收或提供保证金、保函、抵押； 10个工作日内完成额度追加申请或压降计划（催收和控制发货），报财务负责人与风控中心，月度跟踪至额度恢复；保留记录：分析表、停发货通知、追加申请或压降计划、客户确认件。\n预警档：当日冻结该客户赊销额度，停止接单与发货，已排产订单逐笔审批后放行；3 个工作日内报总经理、风控中心与分管领导，达到重大标准的报董事会审计委员会；启动专项催收并按逾期阶梯处置（30 日内书面催收、60 日内上门或律师函、90 日内启动诉讼仲裁评估），同步追偿担保；15 个工作日内完成授信重估或客户退出方案，超授信部分追溯审批责任，查明有无越权审批与拆分规避；纳入季度风险评估与内控缺陷认定，涉嫌舞弊或利益输送的移交内部审计、纪检监察。","warnResp":"当日冻结该客户赊销额度，停止接单与发货，已排产订单逐笔审批后放行；3 个工作日内报总经理、风控中心与分管领导，达到重大标准的报董事会审计委员会；启动专项催收并按逾期阶梯处置（30 日内书面催收、60 日内上门或律师函、90 日内启动诉讼仲裁评估），同步追偿担保；15 个工作日内完成授信重估或客户退出方案，超授信部分追溯审批责任，查明有无越权审批与拆分规避；纳入季度风险评估与内控缺陷认定，涉嫌舞弊或利益输送的移交内部审计、纪检监察。","key":false,"main":{"label":"赊销额度剩余比例","a":30,"b":15,"dir":"+","unit":"%","info":false},"dim":"客户","mode":"agg","det":[{"label":"单户剩余比例","a":10,"b":5,"dir":"+","unit":"%","info":false},{"label":"赊销额度","a":null,"b":null,"dir":null,"unit":"万元","info":true}]},{"id":"TRD-04","domain":"TRD","name":"贸易业务按期交割比例","dir":"正向","definition":"衡量同一个客户在一个合同周期内，按合同约定期限完成业务交割的情况。","formula":"按期交割比例 =（按期交割期数 ÷ 应交割期数）× 100%\n按期交割期数 = 实际交割完成日 ≤ 合同约定该期交割期限最后一日，且交割数量、品质、单据符合合同约定的期数\n应交割期数 = 统计期内合同约定应完成交割的期数 − 经审批的合同变更/顺延期次 − 书面认定的公司方原因逾期期次\n客户级按期交割比例 = Σ各合同按期交割期数 ÷ Σ各合同应交割期数（按期数加权，不作简单平均）","freq":"月度","fk":"M","dept":"贸易公司市场部/市场经营部\n贸易公司财务部门","tN":"按期交割比例≥95%，且单份合同按期交割比例 ≥90%","tA":"按期交割比例 85%–95%，或单份合同按期交割比例 80%–90%","tW":"按期交割比例 <85%，或单份合同按期交割比例 <80%，或任一合同出现单期逾期 >30 天","resp":"关注级：业务部门于 3 个工作日内提交逾期原因说明及补救计划（补交割时间表、客户书面承诺），风控/法律部门核查合同违约条款是否触发，评估是否调整该客户评级与授信额度；连续 2 个统计期处于关注级的，升级为预警级管理。\n预警级：系统锁定该客户新合同下单与新期次发货，业务部门负责人 5 个工作日内牵头制定专项处置方案（催告函、违约金主张、暂停供货、解除权行使）报分管领导审批；同步下调客户信用评级、压降授信额度与账期。\n单期逾期 >30 天、累计逾期 ≥3 期或涉及金额达重大标准的，提交总经理办公会并纳入重大风险事项清单，按重大经营风险报告程序上报董事会/股东单位；因公司方原因造成逾期的，追溯货源组织与单证办理环节责任，纳入部门考核。","warnResp":"系统锁定该客户新合同下单与新期次发货，业务部门负责人 5 个工作日内牵头制定专项处置方案（催告函、违约金主张、暂停供货、解除权行使）报分管领导审批；同步下调客户信用评级、压降授信额度与账期。\n单期逾期 >30 天、累计逾期 ≥3 期或涉及金额达重大标准的，提交总经理办公会并纳入重大风险事项清单，按重大经营风险报告程序上报董事会/股东单位；因公司方原因造成逾期的，追溯货源组织与单证办理环节责任，纳入部门考核。","key":false,"main":{"label":"按期交割比例","a":95,"b":85,"dir":"+","unit":"%","info":false},"dim":"客户","mode":"agg","det":[{"label":"单份合同按期交割比例","a":90,"b":80,"dir":"+","unit":"%","info":false},{"label":"最长单期逾期天数","a":30,"b":30,"dir":"-","unit":"天","info":false}]},{"id":"LOG-01","domain":"LOG","name":"已签订业务合同的项目比例","dir":"正向","definition":"衡量商务及业务操作规范情况，识别无合同或无委托开展业务、在公司商务结算系统虚假上传合同等违规风险。","formula":"签订比例 = 按正常业务开展逻辑签订合同的项目数量 ÷ 实际已进行的项目数量 ×100%。","freq":"半年度/年度","fk":"H","dept":"物流公司商务及业务部门\n物流公司法律合规归口部门","tN":"签订比例100%","tA":"未签合同即开展业务1–2项（签订比例95%–100%，不含100%）；且均已履行补签、未形成纠纷、坏账或收入确认障碍","tW":"未签合同即开展业务3项及以上，或签订比例<95%；或存在虚假上传合同、无委托方开展业务（一经发现即预警，不受比例限制）","resp":"关注档：商务部门/业务单位会同合同归口（法律合规/风控）部门逐项查明未签合同即开展业务的原因（招投标未完成、客户格式合同未回签、框架协议未落地等），10个工作日内形成未签项目清单与补签计划，限期补签或补办书面委托；风控中心复核清单完整性，核对商务结算系统上传合同与实际签署版本是否一致。\n预警档：报集团业务、法律合规及财务归口部门及分管领导，对未签合同项目暂缓结算、开票与付款，以书面委托和审批单作为过渡凭证；协调客户回签及框架协议签署，督办补签落实；涉嫌虚假上传合同、无委托方开展业务的，移交纪检监察机构核查并按公司考核与责任追究办法处理；签约率与补签完成情况纳入季度跟踪。","warnResp":"报集团业务、法律合规及财务归口部门及分管领导，对未签合同项目暂缓结算、开票与付款，以书面委托和审批单作为过渡凭证；协调客户回签及框架协议签署，督办补签落实；涉嫌虚假上传合同、无委托方开展业务的，移交纪检监察机构核查并按公司考核与责任追究办法处理；签约率与补签完成情况纳入季度跟踪。","key":true,"main":{"label":"已签订合同项目比例","a":100,"b":95,"dir":"+","unit":"%","info":false},"aux":[{"label":"未签合同即开展项目数","a":null,"b":null,"dir":null,"unit":"个","info":true}]},{"id":"LOG-02","domain":"LOG","name":"合同内客户需求偏离度","dir":"负向","definition":"衡量客户各期实际需求数量相对合同约定当期需求量（或往期合同平均每期供货量）的偏离程度，识别需求大幅上浮或下浮导致的采购备货失配、运力与库存错配、履约违约及收入预测失真风险。","formula":"单期偏离度 = |当期实际需求数量 − 合同约定当期需求量| ÷ 合同约定当期需求量 × 100%\n平均偏离度 = Σ各期偏离度绝对值 ÷ 统计期数 × 100%\n往期基准偏离度 = |当期实际需求数量 − 往期合同平均每期供货量| ÷ 往期合同平均每期供货量 × 100%","freq":"月度（按合同约定周期提取）","fk":"M","dept":"物流公司、贸易公司各企业商务及业务部门","tN":"单期偏离度≤±10%，且平均偏离度 ≤5%","tA":"单期偏离度 ±10%–±20%，或连续2期同向偏离，或平均偏离度 5%–10%","tW":"单期偏离度 >±20%，或连续3期同向偏离，或平均偏离度 >10%，或偏离已导致库存积压、断供违约、赔付或收入确认调整","resp":"关注档：由各公司商务及业务部门逐合同核对偏离原因（客户生产或销售计划调整、市场行情变化、我方备货与运力配置不足），评估对在途采购、库存及运力的影响，与客户书面确认后续各期需求计划并留存确认件；财务部门测算收入与成本影响；法律合规部门（风控部门）登记偏离台账，跟踪下期是否回归。\n预警档：报集团投资管理、财务及风控归口部门及分管领导，组织专项会商，就数量弹性条款、最小采购量及量价调整机制与客户重议并签订补充协议；对已形成的积压存货启动跌价测试，对可能转为亏损的合同评估预计负债；整改与合同修订进度纳入季度跟踪，连续两期未回归的提级提交经理层专题研究。","warnResp":"报集团投资管理、财务及风控归口部门及分管领导，组织专项会商，就数量弹性条款、最小采购量及量价调整机制与客户重议并签订补充协议；对已形成的积压存货启动跌价测试，对可能转为亏损的合同评估预计负债；整改与合同修订进度纳入季度跟踪，连续两期未回归的提级提交经理层专题研究。","key":false,"main":{"label":"平均需求偏离度","a":5,"b":10,"dir":"-","unit":"%","info":false},"dim":"客户","mode":"agg","det":[{"label":"单期偏离度","a":10,"b":20,"dir":"-","unit":"%","info":false},{"label":"连续同向偏离期数","a":1,"b":2,"dir":"-","unit":"期","info":false}]},{"id":"LOG-03","domain":"LOG","name":"应收款临期催收比例","dir":"正向","definition":"衡量对临近到期的应收账款开展催收的覆盖程度与有效性，识别到期后才催收、催收流于形式及账龄恶化风险，将坏账防控关口前移。","formula":"临期催收比例 = 临期窗口内已完成有效催收的应收款金额 ÷ 当期进入临期窗口的应收款总额 × 100%","freq":"季度","fk":"Q","dept":"物流公司、贸易公司各企业商务及业务部门\n各企业财务部门","tN":"临期催收比例100%，临期窗口内全部完成有效催收并留痕","tA":"临期未有效催收1–2户（比例90%–100%，不含100%）；未催收金额占当月应收余额≤5%，且款项未到期","tW":"临期未有效催收3户及以上，或比例<90%；或未催收金额占比>5%；或临期未催收导致款项到期即逾期","resp":"关注档：由财务部门会同商务及业务部门逐户核实未催收原因，补做对账并取得客户书面金额确认与付款安排，落实催收责任人及完成时点；法律合规部门（风控部门）抽查催收证据是否达到“有效催收”标准（模板提醒、口头催告不计入），抽查结果反馈业务部门。\n预警档：报集团财务、投资管理及风控归口部门及分管领导，对临期未催收客户暂停新增授信、垫资及发货（作业），必要时启动法务函催与担保措施；款项到期即逾期的转入逾期账款专项清收，计提坏账准备并落实催收责任；清收结果纳入季度考核与责任追究跟踪。","warnResp":"报集团财务、投资管理及风控归口部门及分管领导，对临期未催收客户暂停新增授信、垫资及发货（作业），必要时启动法务函催与担保措施；款项到期即逾期的转入逾期账款专项清收，计提坏账准备并落实催收责任；清收结果纳入季度考核与责任追究跟踪。","key":false,"main":{"label":"临期催收比例","a":100,"b":90,"dir":"+","unit":"%","info":false},"dim":"客户","mode":"agg","det":[{"label":"有效催收比例","a":100,"b":90,"dir":"+","unit":"%","info":false},{"label":"临期应收金额","a":null,"b":null,"dir":null,"unit":"万元","info":true}]},{"id":"LOG-04","domain":"LOG","name":"毛利下调率（周期累计）","dir":"负向","definition":"衡量统计期内业务定价毛利下调的广度、频次与深度，识别系统性毛利侵蚀、持续降价换量及亏损业务固化风险。单笔下调本身不构成风险信号，须结合下调面、频次与累计幅度综合判断。","formula":"①下调广度＝期内发生毛利下调的业务收入÷同期业务收入×100%；②下调频次＝单一业务期内累计下调次数（取最大值）；③下调深度＝(首次定价毛利−期末毛利)÷首次定价毛利×100%（取最大值）","freq":"月度（趋势）/季度（判定）","fk":"Q","dept":"业务单位（商务）、财务部门","tN":"下调广度≤10%，且单业务期内下调≤1次，且累计下调深度≤30%","tA":"下调广度10%–20%，或单业务期内下调2次，或累计下调深度30%–50%","tW":"下调广度＞20%，或单业务期内下调≥3次，或累计下调深度＞50%，或下调后毛利率＜0","resp":"正常档：按定价授权制度履行审批，集团不介入（授权：≤10%业务单位负责人；10%–30%业务单位＋投资经营部＋分管领导；＞30%加总经理）。关注档：调阅下调业务清单与成本测算，核对审批层级。预警档：集团约谈、暂停调价执行、开展定价专项审计，并核查是否存在以量补价、亏损换规模。","warnResp":"集团约谈、暂停调价执行、开展定价专项审计，并核查是否存在以量补价、亏损换规模。","key":false,"main":{"label":"毛利下调广度","a":10,"b":20,"dir":"-","unit":"%","info":false},"dim":"客户","mode":"agg","det":[{"label":"累计下调深度","a":30,"b":50,"dir":"-","unit":"%","info":false},{"label":"期内下调次数","a":1,"b":2,"dir":"-","unit":"次","info":false}]},{"id":"LOG-05","domain":"LOG","name":"单一客户收入集中度","dir":"负向","definition":"衡量单一或前五客户营业收入占比，识别客户依赖、议价能力弱化及大客户流失对经营稳定性的冲击。","formula":"单一客户收入占比＝单一客户营业收入÷同期营业收入×100%；同步计算前五大合计占比","freq":"季度","fk":"Q","dept":"财务部门、商务部门","tN":"单户≤20%，前五大≤60%","tA":"单户20%–30%，或前五大60%–70%","tW":"单户>30%，或前五大>70%","resp":"关注档：要求提交客户结构与替代方案；预警档：集团评估业务可持续性、纳入战略风险清单。","warnResp":"集团评估业务可持续性、纳入战略风险清单。","key":false,"main":{"label":"单一客户收入占比","a":20,"b":30,"dir":"-","unit":"%","info":false},"aux":[{"label":"前五大客户占比","a":60,"b":70,"dir":"-","unit":"%","info":false}]},{"id":"LOG-06","domain":"LOG","name":"单一供应商采购集中度","dir":"负向","definition":"衡量对单一或前五供应商的采购依赖程度，识别断供、议价能力弱化及供应商串通风险。","formula":"单一供应商采购占比＝单一供应商采购金额÷同期采购总额×100%；同步计算前五大合计占比","freq":"季度","fk":"Q","dept":"采购归口部门、业务部门","tN":"单户≤25%，前五大≤60%","tA":"单户25%–35%，或前五大60%–70%","tW":"单户>35%，或前五大>70%","resp":"关注档：推动备选供应商开发；预警档：集团组织供应链安全评估、纳入断供应急预案。","warnResp":"集团组织供应链安全评估、纳入断供应急预案。","key":false,"main":{"label":"单一供应商采购占比","a":25,"b":35,"dir":"-","unit":"%","info":false},"aux":[{"label":"前五大供应商占比","a":60,"b":70,"dir":"-","unit":"%","info":false}]},{"id":"INV-01","domain":"INV","name":"参股企业\n现金分红达成率","dir":"正向","definition":"衡量参股（合资）企业按章程约定或持股比例向国有股东实际分配现金的程度，反映投资收益由账面利润转为真实现金回报的实现情况，识别有可分配利润但不实施分红、分红低于约定基准、分红款项未实际到账的情形。","formula":"1）现金分红达成率＝当年实际收到的现金分红÷当年应得现金分红×100%；\n2）应得现金分红＝当年度可分配利润×董事会决定的分红比例×我方持股比例，章程或投资协议未约定分红比例的，以当年度可分配利润×我方持股比例计算；\n3）当年度可分配利润为零或负值的，不纳入达成率计算，按满5年未分红、长期亏损、非持续经营三种情形分别列示户数；\n4）同时列示年度现金回报率＝当年实际收到的现金分红÷我方累计实际出资额×100%。","freq":"半年度/年度","fk":"H","dept":"项目管理单位\n财务会计部","tN":"达成率≥90%","tA":"达成率70%–90%\n3年以上未分红","tW":"达成率<70%\n5年以上未分红","resp":"关注档由项目管理单位在年度投后报告中逐户说明未达成原因，包括未分配利润用途、再投资与扩建安排、其他股东意见，并通过委派董事、股东代表提出分红议案；\n预警档由投资管理部依据《中华人民共和国公司法》与公司章程行使利润分配请求权，对连续两年零分红或满5年未分红的，按41号第二十四条组织价值评估，属低效无效的纳入退出论证，属战略性持有或培育期的强化跟踪管理，评估结论与处置方案报分管领导。","warnResp":"投资管理部依据《中华人民共和国公司法》与公司章程行使利润分配请求权，对连续两年零分红或满5年未分红的，按41号第二十四条组织价值评估，属低效无效的纳入退出论证，属战略性持有或培育期的强化跟踪管理，评估结论与处置方案报分管领导。","key":false,"main":{"label":"现金分红达成率","a":90,"b":70,"dir":"+","unit":"%","info":false},"dim":"参股企业","mode":"agg","det":[{"label":"现金分红达成率","a":90,"b":70,"dir":"+","unit":"%","info":false},{"label":"连续未分红年数","a":2,"b":4,"dir":"-","unit":"年","info":false}]},{"id":"INV-02","domain":"INV","name":"参股企业\n经营性现金流敞口","dir":"正向","definition":"衡量参股（合资）企业当月经营活动现金流入与经营活动现金流出之间的差额状况，反映其主营业务当期的现   const cl = closures(Q).filter(k => k.i.id === id && k.c === c).sort((a, b) => b.q.localeCompare(a.q));
  const loops = cl.map(k => `<div class="panel loop" style="margin-top:14px;border-left-color:${k.st === '已销号' ? 'var(--g)' : 'var(--r)'}">
      <h3>风险闭环 · ${esc(k.q)} 预警信号 <span class="note" style="font-weight:400">触发日期 ${k.date}</span></h3>
      <div class="row"><b>系统提示措施</b><span style="white-space:pre-line">${esc(i.warnResp)}</span></div>
      <div class="row"><b>责任部门</b><span>${deptHtml(i, c)}</span></div>
      <div class="row"><b>实际处置</b><span>${k.act ? esc(k.act) : '<span class="note">尚未反馈处置情况</span>'}</span></div>
      <div class="row"><b>与提示一致性</b><span class="cons-${esc(k.cons)}">${esc(k.cons || '—')}</span></div>
      <div class="row"><b>处置状态</b><span><b style="color:var(--ink)">${esc(k.st)}</b>${k.recovered ? '<span class="note">　指标本期已恢复</span>' : '<span class="note">　指标本期仍处预警</span>'}</span></div>
      ${k.st === '已完成' ? `<div class="row"><b></b><span><button class="btn pri" data-close="${esc(k.id)}">确认销号</button> <span class="note">指标恢复后不自动销号，须人工确认</span></span></div>` : ''}
    </div>`).join('');
  $('#app').innerHTML = `
    <h2>${esc(i.id)} ${esc(i.name)}${i.key ? ' <span class="key" style="font-size:15px">★关键指标</span>' : ''}</h2>
    <p class="lead">${esc(cname(c))} · ${esc(period(i, Q))} · 本期 <b class="num" style="color:var(--ink)">${r && !r.na ? esc(fmt(r.v, i.main.unit)) : '未报送'}</b> ${chip(s)}</p>
    <div class="two">
      <div class="panel"><h3>趋势（背景为正常／关注／预警区间）</h3><div class="fig"><svg id="ch" role="img" aria-label="${esc(i.name)}趋势"></svg></div></div>
      <div class="panel"><h3>指标口径</h3><dl class="kv">
        <dt>阈值</dt><dd>${esc(thr(i.main))}</dd>${aux}
        <dt>定义</dt><dd>${esc(i.definition)}</dd><dt>计算公式</dt><dd>${esc(i.formula)}</dd>
        <dt>统计频率</dt><dd>${esc(i.freq)}</dd><dt>责任部门</dt><dd>${deptHtml(i, c)}</dd></dl></div>
    </div>
    ${detail}${loops}`;
  if (r && !r.na) chart($('#ch'), i, c);
  const svg = $('#ch'), tip = $('#tip');
  svg && svg.addEventListener('mousemove', e => { const t = e.target.dataset && e.target.dataset.t; if (!t) { tip.style.display = 'none'; return; } tip.textContent = t; tip.style.display = 'block'; tip.style.left = e.pageX + 12 + 'px'; tip.style.top = e.pageY - 30 + 'px'; });
  svg && svg.addEventListener('mouseleave', () => tip.style.display = 'none');
}
function render() {
  const h = location.hash.slice(1);
  $('#tip').style.display = 'none';
  let m;
  if ((m = h.match(/^d-([A-Z]{3})$/))) L2(m[1]);
  else if ((m = h.match(/^c-([A-Z]{3})-([A-Z]+)$/))) L3(m[1], m[2]);
  else if ((m = h.match(/^i-([A-Z]{3}-\d\d)-([A-Z]+)$/))) L4(m[1], m[2]);
  else L1();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const cb = e.target.closest('[data-close]');
  if (cb) { closeState[cb.dataset.close] = '已销号'; render(); return; }
  const t = e.target.closest('[data-h]');
  if (t) { e.preventDefault(); go(t.dataset.h); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.h !== undefined) go(e.target.dataset.h); });
window.addEventListener('hashchange', render);
Promise.resolve(JSON.parse(document.getElementById('dd').textContent)).then(d => {
  D = d; Q = D.quarters[D.quarters.length - 1];
  const sel = $('#q');
  sel.innerHTML = D.quarters.map(q => `<option ${q === Q ? 'selected' : ''}>${q}</option>`).join('');
  sel.addEventListener('change', () => { Q = sel.value; render(); });
  render();
}).catch(() => { $('#app').innerHTML = '<p class="lead">数据加载失败，请刷新页面。</p>'; });
}
</script>
</body>
</html>
